<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cliv</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="upload">
      <div id="dropZone">
        <h1>cliv - 動画クリップ → GIF</h1>
        <label
          >動画を選択・ドロップ<input
            id="file"
            type="file"
            accept="video/*,.mp4,.mov,.webm,.mkv"
        /></label>
        <p id="uploadError" role="alert" hidden></p>
      </div>
    </div>
    <div id="editor" hidden>
      <header>
        <span id="fileName"></span><span id="dimensions"></span
        ><button id="replace">動画を変更</button>
      </header>
      <main>
        <div id="preview">
          <div id="stage">
            <video id="video" preload="auto" playsinline muted></video>
            <div id="overlay" aria-label="ドラッグで切り抜き範囲を指定">
              <div id="cropBox" hidden></div>
            </div>
          </div>
        </div>
        <aside>
          <section>
            <h2>切り抜き（px）</h2>
            <div class="fields">
              <label>X<input id="x" type="number" min="0" step="1" /></label
              ><label>Y<input id="y" type="number" min="0" step="1" /></label
              ><label>幅<input id="w" type="number" min="1" step="1" /></label
              ><label
                >高さ<input id="h" type="number" min="1" step="1"
              /></label>
            </div>
            <button id="resetCrop">全画面</button>
          </section>
          <section>
            <h2>フレーム範囲</h2>
            <div class="fields">
              <label
                >開始<input
                  id="startFrame"
                  type="number"
                  min="0"
                  step="1" /></label
              ><label
                >終了（含む）<input
                  id="endFrame"
                  type="number"
                  min="0"
                  step="1"
              /></label>
            </div>
          </section>
          <label
            >元動画のFPS<input
              id="fps"
              type="number"
              min="0.001"
              max="1000"
              step="any"
              value="30" /><span id="fpsStatus" role="status"></span
          ></label>
          <label
            >出力名<input id="out" value="output1" spellcheck="false"
          /></label>
          <label
            >実行するFFmpegコマンド<textarea
              id="command"
              readonly
              spellcheck="false"
            ></textarea>
          </label>
          <div class="export-buttons">
            <button id="export">GIFを生成</button
            ><button id="cancel" disabled>中止</button>
          </div>
          <progress id="progress" max="1" value="0" hidden></progress>
          <p id="status" role="status" hidden></p>
          <div id="result" hidden>
            <img id="resultImage" alt="生成したGIF" />
            <span id="resultInfo"></span>
            <a id="download" href="#">ダウンロード</a>
          </div>
        </aside>
      </main>
      <footer>
        <div class="transport">
          <button id="play" aria-label="再生">▶</button
          ><button id="prev" aria-label="1フレーム戻る">◀</button
          ><button id="next" aria-label="1フレーム進む">▶</button
          ><label
            >フレーム<input
              id="currentFrame"
              type="number"
              min="0"
              value="0"
              step="1" /></label
          ><button
            id="setStart"
            class="mark-frame"
            aria-label="現在位置を始点に"
          >
            <svg
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M5 3v14M5 10h11" />
            </svg></button
          ><button id="setEnd" class="mark-frame" aria-label="現在位置を終点に">
            <svg
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M15 3v14M4 10h11" />
            </svg></button
          ><span id="time"></span>
        </div>
        <div id="timelineViewport">
          <div id="timeline" aria-label="タイムライン">
            <canvas id="ticks"></canvas>
            <div id="track"></div>
            <div id="range">
              <button
                id="trimStart"
                class="trim"
                role="slider"
                aria-label="開始フレーム"
                aria-valuemin="0"
              ></button
              ><button
                id="trimEnd"
                class="trim"
                role="slider"
                aria-label="終了フレーム"
                aria-valuemin="0"
              ></button>
            </div>
            <div id="playhead"></div>
          </div>
        </div>
      </footer>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
